<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../css/style.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto:wght@400&display=swap"
    rel="stylesheet"
  >

  <title>Recherche de maisons</title>
</head>

<body>

  <div class="container">

    <h1>Recherche de maison</h1>

    <!-- ========================= -->
    <!-- BOUTONS DE MODE            -->
    <!-- ========================= -->

    <div class="mode-buttons">

      <button
        id="trackingButton"
        onclick="setMode('tracking')"
      >
        🔎 Tracking
      </button>

      <button
        id="editButton"
        onclick="setMode('edit')"
      >
        ✏️ Edit
      </button>

    </div>


    <!-- ========================= -->
    <!-- TRACKING                   -->
    <!-- ========================= -->

    <section id="trackingMode">

      <h3>Recherche par ID</h3>

      <input
        id="idSearch"
        type="number"
        placeholder="ID de la maison"
      >

      <button onclick="searchById()">
        Rechercher ID
      </button>


      <h3>Recherche par position</h3>

      <input
        id="xSearch"
        type="number"
        placeholder="X"
      >

      <input
        id="ySearch"
        type="number"
        placeholder="Y"
      >

      <button onclick="searchByPosition()">
        Rechercher position
      </button>


      <h3>Recherche par pseudo</h3>

      <input
        id="playerSearch"
        type="text"
        placeholder="Pseudo joueur..."
        oninput="searchByPlayer()"
      >


      <div id="list"></div>

      <div id="details"></div>

    </section>


    <!-- ========================= -->
    <!-- EDIT                       -->
    <!-- ========================= -->

    <section
      id="editMode"
      style="display: none;"
    >

      <h3>Modification des propriétaires</h3>

      <button
        id="saveButton"
        onclick="saveAllChanges()"
      >
        💾 Enregistrer les modifications
      </button>

      <div id="editList"></div>

    </section>

  </div>


  <script src="../scripts/houses.js" defer></script>

</body>
</html>
